# docker-compose version removed (Compose V2 infers version)

services:
  # ------------------------------------------------------------
  # Backend – Node/Express API
  # ------------------------------------------------------------
  backend:
    container_name: truck-system-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./backend/.env
    environment:
      - NODE_NO_WARNINGS=1
    volumes:
      - ./backend:/app:delegated
      - backend_node_modules:/app/node_modules
    # Apply committed migrations before boot so a schema commit can't outrun the
    # database (TTP-15). Never `db push` here: this points at the SHARED Supabase
    # DB, and a push from a stale checkout silently drops columns it doesn't
    # know about (this dropped Transaction.clientRef on 2026-11-10). `migrate
    # deploy` only adds what's in prisma/migrations and never drops anything.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Frontend – Vite / React
  # ------------------------------------------------------------
  frontend:
    container_name: truck-system-frontend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
      - BACKEND_PROXY_TARGET=http://backend:5000
      - NODE_OPTIONS=--max-http-header-size=245760
    volumes:
      # Live mount — edits hot-reload instantly via Vite HMR (no rebuild needed)
      - ./frontend:/app:delegated
      # Use the image's node_modules, not the host's
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s



volumes:
  frontend_node_modules:
  backend_node_modules:
